{% extends "base.html" %}

{% block content %}

<!-- NUEVOS ESTILOS PARA ENSANCHAR EL TABLÓN -->
<style>
    .minijuego-hud {
        /* Estiramos el tablón de madera para que abarque todo el texto */
        background-size: 100% 100% !important;
        
        /* Le damos un ancho mínimo más grande (puedes subir este número si lo necesitas más ancho) */
        min-width: 450px !important; 
        
        /* Ajustamos los bordes internos para que el texto no toque las hojas verdes */
        padding: 30px 50px !important; 
        
        /* Organizamos el contenido internamente */
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        gap: 30px !important; 
        margin: 0 auto 30px auto !important; 
    }
    
    .minijuego-hud h2 {
        margin: 0 !important;
        font-size: 1.3rem !important;
        /* Esto evita que el texto salte a la línea de abajo */
        white-space: nowrap !important; 
    }
</style>

<div class="minijuego-container">
    
    <!-- Panel de información (HUD) -->
    <div class="minijuego-hud">
        <h2>⏱️ Tiempo: <span id="tiempo-restante">30</span>s</h2>
        <h2>🌸 Flores: <span id="puntuacion">0</span> / 10</h2>
    </div>

    <!-- El tablero 3x3 -->
    <div class="estanque-grid">
        <!-- Creamos 9 casillas. Cada una tiene el nenúfar de fondo y una flor oculta -->
        {% for i in range(1, 10) %}
        <div class="nenufar-casilla" id="casilla-{{ i }}">
            <!-- Reutilizamos la clase flor-animada que creamos antes -->
            <div class="flor-animada flor-oculta" onclick="atraparFlor(this)"></div>
        </div>
        {% endfor %}
    </div>
    
    <div id="mensaje-final" style="display: none;">
        <h2 id="texto-resultado">¡Completado!</h2>
        <a href="/" class="boton-opcion" style="text-decoration: none; display: inline-block; margin-top: 10px;">Volver al Mapa</a>
    </div>

</div>

<script src="{{ url_for('static', filename='js/minijuego.js') }}"></script>
{% endblock %}
