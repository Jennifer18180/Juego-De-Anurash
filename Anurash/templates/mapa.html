{% extends "base.html" %}

{% block content %}
<div class="mapa-container">
    
    <div class="cabecera-mapa">
        <h1 class="titulo-mapa">Estanque de Aprendizaje</h1>
    </div>

    <!-- El camino de niveles -->
    <div class="ruta-niveles">
        
        <!-- Nivel 3: Bloqueado (Gris) -->
        <!-- Usamos estilos en línea (align-self) para hacer el zig-zag -->
        <div class="nivel-nodo bloqueado" style="align-self: flex-start;">
            <span class="nivel-numero">3</span>
            <span class="nivel-nombre">Bucles (For/While)</span>
        </div>

        <!-- Nivel 2: Nivel Actual (Donde está tu ranita) -->
        <a href="/quiz/2" class="nivel-nodo actual" style="align-self: flex-end;">
            <!-- La ranita feliz sentada en el nenúfar -->
            <img src="{{ url_for('static', filename='img/rana_feliz.png') }}" class="rana-avatar-mapa" alt="Tu Rana">
            <span class="nivel-numero">2</span>
            <span class="nivel-nombre">Variables</span>
        </a>

        <!-- Nivel 1: Completado -->
        <a href="/quiz/1" class="nivel-nodo completado" style="align-self: center;">
            <span class="nivel-numero">1</span>
            <span class="nivel-nombre">Conceptos Básicos</span>
        </a>

    </div>
    
    <!-- Botones extra para navegar -->
    <div class="controles-inferiores">
        <a href="/minijuego" class="boton-opcion" style="text-decoration: none;">🌸 Jugar por Vidas</a>
        <!-- Este botón de tienda lo prepararemos más adelante -->
        <!-- Cambia esta línea en mapa.html -->
        <a href="/tienda" class="boton-opcion" style="text-decoration: none;">⛺ Tienda Mágica</a>
    </div>

</div>
{% endblock %}
